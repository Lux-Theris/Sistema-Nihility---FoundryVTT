<svg xmlns="http://www.w3.org/2000/svg" width="660" height="581" viewBox="0 0 660 581"><rect width="660" height="581" fill="#ffffff"/><text x="28" y="43" fill="#24292d" font-family="Georgia" font-size="29" font-weight="normal">O ciclo de uma Skill</text><path d="M28 64 H632" stroke="#985b46" stroke-width="2"/><text x="28" y="102" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">01</text><text x="82" y="102" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Nível 1</text><text x="82" y="133" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">É o ponto de partida da Skill.</text><text x="28" y="177" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">02</text><text x="82" y="177" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Níveis 2 e 3: Poder</text><text x="82" y="208" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Cada avanço multiplica o efeito por 1,10, no</text><text x="82" y="239" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">padrão da mesa.</text><text x="28" y="283" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">03</text><text x="82" y="283" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Níveis 4 e 5: Desconto</text><text x="82" y="314" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Cada avanço reduz em 20% o Custo que estava</text><text x="82" y="345" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">valendo.</text><text x="28" y="389" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">04</text><text x="82" y="389" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">O ciclo continua</text><text x="82" y="420" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Dois avanços de Poder, depois dois de Desconto.</text><text x="82" y="451" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Os valores são configuráveis.</text><path d="M28 481 H632" stroke="#c7b9aa"/><text x="28" y="512" fill="#40566a" font-family="Segoe UI" font-size="20" font-weight="normal">O piso padrão de Custo é 10% do original. Quando já está</text><text x="28" y="540" fill="#40566a" font-family="Segoe UI" font-size="20" font-weight="normal">no piso, o avanço de Desconto vira Poder.</text></svg>