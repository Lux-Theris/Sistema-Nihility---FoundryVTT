<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa1c2"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .ti { fill: #e6e8f2; font-size: 18px; font-weight: 700; }
    .tx { fill: #e6e8f2; font-size: 12.5px; }
    .bd { fill: #e6e8f2; font-size: 13px; font-weight: 700; }
    .mu { fill: #9aa1c2; font-size: 11px; }
    .lb { fill: #9aa1c2; font-size: 11px; font-weight: 700; letter-spacing: .8px; }
    .num { fill: #12141c; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .ar { stroke: #9aa1c2; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .st { fill: #232738; stroke: #4a5380; }
  </style>
  <rect width="960" height="690" rx="14" fill="#12141c"/>
  <text x="30" y="40" class="ti">Do dado à Vida: o caminho de um golpe</text>
  <text x="30" y="60" class="mu">Vale igual para Skill de dano, ataque com arma e disparo de nave. O chat mostra a rolagem bruta e, no fim, o número final de cada alvo.</text>

  <text x="30" y="92" class="lb">1 · QUEM ATACA</text>
  <g>
    <rect x="30" y="102" width="172" height="78" rx="8" class="st"/>
    <circle cx="46" cy="118" r="9" fill="#e8c170"/><text x="46" y="122" class="num">1</text>
    <text x="62" y="123" class="bd">Rolagem</text>
    <text x="42" y="144" class="mu">fórmula da Skill ou arma</text>
    <text x="42" y="160" class="mu">Vantagem: rola 2× e fica</text>
    <text x="42" y="173" class="mu">com o maior</text>
    <path d="M202 141 H212" class="ar"/>
    <rect x="214" y="102" width="172" height="78" rx="8" class="st"/>
    <circle cx="230" cy="118" r="9" fill="#e8c170"/><text x="230" y="122" class="num">2</text>
    <text x="246" y="123" class="bd">Escala por Atributo</text>
    <text x="226" y="144" class="mu">× (Atributo.Total)² ÷ 10</text>
    <text x="226" y="160" class="mu">só se a Skill/arma tiver</text>
    <text x="226" y="173" class="mu">Atributo de Escala</text>
    <path d="M386 141 H396" class="ar"/>
    <rect x="398" y="102" width="172" height="78" rx="8" class="st"/>
    <circle cx="414" cy="118" r="9" fill="#e8c170"/><text x="414" y="122" class="num">3</text>
    <text x="430" y="123" class="bd">Nível da Skill</text>
    <text x="410" y="144" class="mu">× Poder acumulado</text>
    <text x="410" y="160" class="mu">(nível 3 = ×1,21 no padrão)</text>
    <path d="M570 141 H580" class="ar"/>
    <rect x="582" y="102" width="172" height="78" rx="8" class="st"/>
    <circle cx="598" cy="118" r="9" fill="#e8c170"/><text x="598" y="122" class="num">4</text>
    <text x="614" y="123" class="bd">Bônus de arma</text>
    <text x="594" y="144" class="mu">aprimoramentos vindos</text>
    <text x="594" y="160" class="mu">de Skills (× e depois +)</text>
    <path d="M754 141 H764" class="ar"/>
    <rect x="766" y="102" width="164" height="78" rx="8" class="st"/>
    <circle cx="782" cy="118" r="9" fill="#e8c170"/><text x="782" y="122" class="num">5</text>
    <text x="798" y="123" class="bd">Shift + clique</text>
    <text x="778" y="144" class="mu">+ − × ÷ livres,</text>
    <text x="778" y="160" class="mu">na ordem escrita</text>
  </g>
  <path d="M848 180 V192 H116 V210" class="ar"/>

  <text x="132" y="207" class="lb">2 · ENTRE OS DOIS</text>
  <g>
    <rect x="30" y="214" width="210" height="78" rx="8" class="st"/>
    <circle cx="46" cy="230" r="9" fill="#e8c170"/><text x="46" y="234" class="num">6</text>
    <text x="62" y="235" class="bd">Escala (Pessoal ↔ Nave)</text>
    <text x="42" y="256" class="mu">× fator elevado à diferença</text>
    <text x="42" y="272" class="mu">de degraus (se ligado)</text>
    <path d="M240 253 H250" class="ar"/>
    <rect x="252" y="214" width="210" height="78" rx="8" class="st"/>
    <circle cx="268" cy="230" r="9" fill="#e8c170"/><text x="268" y="234" class="num">7</text>
    <text x="284" y="235" class="bd">Bônus condicional</text>
    <text x="264" y="256" class="mu">“+25% contra Dracônicos”</text>
    <text x="264" y="272" class="mu">(Títulos, Skills, Itens)</text>
    <path d="M462 253 H472" class="ar"/>
    <rect x="474" y="214" width="210" height="78" rx="8" fill="#3a2317" stroke="#ff9f43"/>
    <circle cx="490" cy="230" r="9" fill="#e8c170"/><text x="490" y="234" class="num">8</text>
    <text x="506" y="235" class="bd">Estrutura no caminho</text>
    <text x="486" y="256" class="mu">parede/barreira absorve primeiro,</text>
    <text x="486" y="272" class="mu">até a Vida dela; o resto passa</text>
    <path d="M684 253 H694" class="ar"/>
    <rect x="696" y="214" width="234" height="78" rx="8" fill="#1d2744" stroke="#4f8cff"/>
    <circle cx="712" cy="230" r="9" fill="#e8c170"/><text x="712" y="234" class="num">9</text>
    <text x="728" y="235" class="bd">O alvo é Nave/Veículo?</text>
    <text x="708" y="256" class="mu">Sim → Evasão e cascata Escudo →</text>
    <text x="708" y="272" class="mu">Casco → Integridade (automática)</text>
  </g>
  <path d="M580 292 V310" class="ar"/>
  <text x="590" y="306" class="mu">Personagem / Criatura</text>

  <text x="30" y="326" class="lb">3 · DEFESAS DO ALVO — POR ELEMENTO</text>
  <rect x="30" y="334" width="900" height="168" rx="10" fill="#171a26" stroke="#a78bfa"/>
  <circle cx="50" cy="354" r="10" fill="#e8c170"/><text x="50" y="358" class="num">10</text>
  <text x="68" y="359" class="bd">O golpe é dividido em partes iguais, uma por elemento. Cada parte sofre só as defesas que valem para ela:</text>
  <g>
    <rect x="50" y="376" width="190" height="62" rx="8" fill="#1f3a2e" stroke="#5fd08f"/>
    <text x="62" y="398" class="bd">Bônus contra Traço</text>
    <text x="62" y="416" class="mu">ex.: Pólaron +20% contra</text>
    <text x="62" y="430" class="mu">alvo Orgânico</text>
    <path d="M240 407 H254" class="ar"/>
    <rect x="256" y="376" width="200" height="62" rx="8" fill="#2a2346" stroke="#a78bfa"/>
    <text x="268" y="398" class="bd">Defesa Mágica</text>
    <text x="268" y="416" class="mu">só se o golpe for Mágico:</text>
    <text x="268" y="430" class="mu">2% por ponto, máx. 60%</text>
    <path d="M456 407 H470" class="ar"/>
    <rect x="472" y="376" width="200" height="62" rx="8" fill="#2a2346" stroke="#a78bfa"/>
    <text x="484" y="398" class="bd">Resistência Geral</text>
    <text x="484" y="416" class="mu">Skill (10%/nível, máx. 50%)</text>
    <text x="484" y="430" class="mu">+ Títulos + condicionais</text>
    <path d="M672 407 H686" class="ar"/>
    <rect x="688" y="376" width="222" height="62" rx="8" fill="#2a2346" stroke="#a78bfa"/>
    <text x="700" y="398" class="bd">Resistência do elemento</text>
    <text x="700" y="416" class="mu">≥ 100% = Imunidade:</text>
    <text x="700" y="430" class="mu">zera só esta parte</text>
  </g>
  <text x="50" y="462" class="tx"><tspan style="font-weight:700;fill:#6ee7ff">Penetração</tspan> do elemento suaviza cada defesa na mesma proporção — mas nunca atravessa Imunidade.</text>
  <text x="50" y="484" class="tx"><tspan style="font-weight:700;fill:#e8c170">Dano Absoluto</tspan> pula este bloco inteiro (e o Escudo pessoal). Só uma Estrutura no caminho ou a Evasão de uma nave o seguram.</text>

  <path d="M116 502 V520" class="ar"/>
  <text x="30" y="538" class="lb">4 · NA MESA</text>
  <g>
    <rect x="30" y="548" width="280" height="118" rx="8" class="st"/>
    <circle cx="46" cy="564" r="10" fill="#e8c170"/><text x="46" y="568" class="num">11</text>
    <text x="64" y="569" class="bd">Card no chat</text>
    <text x="42" y="592" class="mu">Rolagem bruta (os dados são públicos)</text>
    <text x="42" y="610" class="tx">“… — Goblin: 37 — causa Queimadura”</text>
    <text x="42" y="630" class="mu">O número final nunca revela quanto</text>
    <text x="42" y="644" class="mu">foi reduzido nem por quê.</text>
    <path d="M310 607 H328" class="ar"/>
    <rect x="330" y="548" width="300" height="118" rx="8" fill="#2a2618" stroke="#e8c170"/>
    <circle cx="346" cy="564" r="10" fill="#e8c170"/><text x="346" y="568" class="num">12</text>
    <text x="364" y="569" class="bd">Mestre clica</text>
    <rect x="344" y="582" width="86" height="24" rx="4" fill="#2b3150" stroke="#4a5380"/><text x="356" y="598" class="tx">Aplicar 37</text>
    <rect x="436" y="582" width="68" height="24" rx="4" fill="#2b3150" stroke="#4a5380"/><text x="448" y="598" class="tx">Metade</text>
    <rect x="510" y="582" width="64" height="24" rx="4" fill="#2b3150" stroke="#4a5380"/><text x="522" y="598" class="tx">Dobro</text>
    <text x="344" y="628" class="mu">Depois do clique vira “✓ 12 no Escudo · 25 na Vida”</text>
    <text x="344" y="644" class="mu">e um botão ↩ Desfazer (volta os valores exatos).</text>
    <path d="M630 607 H648" class="ar"/>
    <rect x="650" y="548" width="280" height="118" rx="8" fill="#2b1a1c" stroke="#e5534b"/>
    <text x="664" y="570" class="bd">Escudo pessoal → Vida</text>
    <text x="664" y="592" class="mu">O Escudo absorve até zerar;</text>
    <text x="664" y="608" class="mu">só o resto sai da Vida.</text>
    <text x="664" y="630" class="mu">Condições do elemento (Queimadura…)</text>
    <text x="664" y="646" class="mu">só entram agora, com o acerto confirmado.</text>
  </g>
</svg>
