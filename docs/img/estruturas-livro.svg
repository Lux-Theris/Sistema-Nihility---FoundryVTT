<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0 H0 V36" fill="none" stroke="#a99b8a"/>
    </pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a46c40"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#24292d"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Georgia', Arial, sans-serif; }
    .ti { fill: #24292d; font-size: 18px; font-weight: 700; }
    .tx { fill: #24292d; font-size: 12.5px; }
    .bd { fill: #24292d; font-size: 13px; font-weight: 700; }
    .mu { fill: #52636c; font-size: 11.5px; }
    .tok { font-size: 13px; font-weight: 700; fill: #24292d; text-anchor: middle; }
  </style>
  <rect width="960" height="440" rx="14" fill="#ffffff"/>
  <text x="30" y="40" class="ti">Estruturas no mapa: paredes que seguram golpes</text>

  <!-- cena 1 -->
  <rect x="30" y="60" width="420" height="250" rx="10" fill="url(#grid)" stroke="#a99b8a"/>
  <text x="44" y="82" class="bd">Parede de Pedra no caminho</text>
  <circle cx="80" cy="200" r="18" fill="#a99b8a" stroke="#a35042" stroke-width="2"/><text x="80" y="205" class="tok">A</text>
  <circle cx="390" cy="200" r="18" fill="#f4f1eb" stroke="#486678" stroke-width="2"/><text x="390" y="205" class="tok">T</text>
  <path d="M232 110 L248 180 L240 248" stroke="#a99b8a" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <rect x="258" y="104" width="120" height="30" rx="4" fill="#ffffff" stroke="#a99b8a"/>
  <text x="266" y="117" class="mu" style="fill:#24292d">Parede de Pedra</text>
  <rect x="266" y="122" width="104" height="6" rx="3" fill="#a99b8a"/><rect x="266" y="122" width="43" height="6" rx="3" fill="#527565"/>
  <path d="M100 200 H236" stroke="#a46c40" stroke-width="3" fill="none"/>
  <path d="M252 200 H368" stroke="#a46c40" stroke-width="3" stroke-dasharray="6 5" fill="none" marker-end="url(#a)"/>
  <text x="112" y="190" class="mu" style="fill:#24292d">golpe de 40</text>
  <text x="270" y="190" class="mu" style="fill:#24292d">passam 15</text>
  <text x="44" y="276" class="mu">A parede (Vida 25) segura 25 e cai; só 15</text>
  <text x="44" y="292" class="mu">chegam em T — antes das defesas de T.</text>

  <!-- cena 2 -->
  <rect x="470" y="60" width="200" height="250" rx="10" fill="url(#grid)" stroke="#a99b8a"/>
  <text x="484" y="82" class="bd">Barreira de Mana</text>
  <circle cx="570" cy="190" r="62" fill="#24292d" fill-opacity=".12" stroke="#24292d" stroke-width="6" stroke-opacity=".8"/>
  <circle cx="570" cy="190" r="18" fill="#f4f1eb" stroke="#87634f" stroke-width="2"/><text x="570" y="195" class="tok">C</text>
  <path d="M588 190 H660" stroke="#24292d" stroke-width="3" fill="none" marker-end="url(#b)"/>
  <text x="484" y="276" class="mu">Quem ergueu atira de</text>
  <text x="484" y="292" class="mu">dentro sem ser bloqueado.</text>

  <!-- regras -->
  <rect x="690" y="60" width="240" height="250" rx="10" fill="#f4f1eb" stroke="#a99b8a"/>
  <text x="706" y="84" class="bd">Como se comporta</text>
  <text x="706" y="106" class="mu">• Vira parede de verdade: bloqueia</text>
  <text x="706" y="122" class="mu">   movimento (e visão, se o catálogo</text>
  <text x="706" y="138" class="mu">   mandar).</text>
  <text x="706" y="158" class="mu">• Vida 0 no catálogo = barreira de</text>
  <text x="706" y="174" class="mu">   mana: o dano sai da Mana de quem</text>
  <text x="706" y="190" class="mu">   conjurou.</text>
  <text x="706" y="210" class="mu">• Mesmo Dano Absoluto é segurado</text>
  <text x="706" y="226" class="mu">   (parede é cobertura, não defesa).</text>
  <text x="706" y="246" class="mu">• Em ataque de área, a estrutura</text>
  <text x="706" y="262" class="mu">   apanha uma vez só e todo mundo</text>
  <text x="706" y="278" class="mu">   atrás dela recebe a mesma sobra.</text>

  <text x="30" y="342" class="bd">Formas e controles ao posicionar</text>
  <text x="30" y="364" class="tx"><tspan style="font-weight:700">Linha:</tspan> clique no início e no fim.   <tspan style="font-weight:700">Forma livre:</tspan> clique ponto a ponto; Enter termina, Backspace desfaz; acaba sozinha no tamanho máximo.</text>
  <text x="30" y="384" class="tx"><tspan style="font-weight:700">Círculo / Quadrado:</tspan> segue o mouse, clique confirma.   Esc ou clique direito cancelam. Shift segurado desliga o encaixe no grid.</text>
  <text x="30" y="412" class="mu">Some quando: a Vida chega a 0 · acabam as rodadas · a Skill Ativa é desligada · o Mestre derruba · a Vida ou a Mana de quem conjurou chega a 0.</text>
</svg>
