<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .tx { fill: #e6e8f2; font-size: 13px; }
    .bd { fill: #e6e8f2; font-size: 13px; font-weight: 700; }
    .h2 { fill: #e6e8f2; font-size: 17px; font-weight: 700; }
    .mu { fill: #9aa1c2; font-size: 11.5px; }
    .lb { fill: #c9b8ff; font-size: 11px; font-weight: 700; letter-spacing: .8px; }
    .row { fill: #1b1e2b; stroke: #2e3350; }
    .btn { fill: #2b3150; stroke: #4a5380; }
    .st { fill: #9aa1c2; font-size: 11px; text-anchor: end; }
    .co circle { fill: #e8c170; stroke: #12141c; stroke-width: 2; }
    .co text { fill: #12141c; font-size: 12px; font-weight: 700; text-anchor: middle; }
  </style>
  <rect width="960" height="560" rx="14" fill="#12141c"/>
  <rect x="20" y="20" width="920" height="520" rx="10" fill="#171a26" stroke="#343a55"/>
  <rect x="20" y="20" width="920" height="28" rx="10" fill="#252a40"/><rect x="20" y="36" width="920" height="12" fill="#252a40"/>
  <text x="36" y="39" class="mu">Nihility RPG System</text>

  <!-- trilho -->
  <rect x="20" y="48" width="200" height="492" fill="#12141c"/>
  <rect x="30" y="64" width="180" height="34" rx="6" fill="#20243a"/><text x="44" y="86" class="tx">Fichas</text>
  <rect x="30" y="104" width="180" height="34" rx="6" fill="#3b2f63" stroke="#a78bfa"/><text x="44" y="126" class="bd">Configurações Gerais</text>
  <rect x="30" y="144" width="180" height="34" rx="6" fill="#20243a"/><text x="44" y="166" class="tx">Criar com IA</text>
  <rect x="30" y="184" width="180" height="34" rx="6" fill="#20243a"/><text x="44" y="206" class="tx">Ferramentas de Admin</text>
  <text x="34" y="250" class="mu">Jogadores veem as três</text>
  <text x="34" y="266" class="mu">últimas com cadeado.</text>
  <text x="34" y="292" class="mu">Abas de blocos desligados</text>
  <text x="34" y="308" class="mu">somem da trilha.</text>

  <!-- conteúdo -->
  <text x="244" y="80" class="h2">Configurações Gerais</text>
  <text x="244" y="98" class="mu">Tudo que a campanha configura, por assunto. Cada linha mostra o que já tem.</text>
  <rect x="244" y="108" width="676" height="28" rx="6" fill="#1b1e2b" stroke="#3a4060"/>
  <text x="256" y="127" class="mu">⌕  Buscar uma regra ou catálogo...</text>

  <text x="244" y="160" class="lb">CAMPANHA</text>
  <rect x="244" y="168" width="676" height="34" rx="6" class="row"/><text x="258" y="190" class="bd">Módulos do Sistema</text><text x="410" y="190" class="mu">Ligar/desligar blocos e aplicar presets</text><text x="840" y="190" class="st">13 de 19 ligados</text>
  <rect x="852" y="174" width="58" height="22" rx="4" class="btn"/><text x="866" y="189" class="tx">Abrir</text>
  <rect x="244" y="206" width="676" height="34" rx="6" class="row"/><text x="258" y="228" class="bd">Regras da Mesa</text><text x="410" y="228" class="mu">XP, pontos por nível, fórmulas de Vida/Mana…</text><text x="840" y="228" class="st">25 regras</text>
  <rect x="852" y="212" width="58" height="22" rx="4" class="btn"/><text x="866" y="227" class="tx">Abrir</text>

  <text x="244" y="264" class="lb">PERSONAGEM</text>
  <rect x="244" y="272" width="676" height="30" rx="6" class="row"/><text x="258" y="292" class="tx">Atributos · Espécies · Traços · Moedas · Compêndio de Títulos · Compêndio de Itens</text>

  <text x="244" y="326" class="lb">COMBATE E DANO</text>
  <rect x="244" y="334" width="676" height="30" rx="6" class="row"/><text x="258" y="354" class="tx">Tipos de Dano · Condições · Escalas · Estruturas</text>

  <text x="244" y="388" class="lb">NAVES</text>
  <rect x="244" y="396" width="676" height="30" rx="6" class="row"/><text x="258" y="416" class="tx">Categorias de Módulo · Classes de Nave · Classes de Veículo · Postos de Tripulação</text>

  <rect x="244" y="446" width="676" height="44" rx="6" fill="#2a2618" stroke="#e8c170" stroke-opacity=".6"/>
  <text x="258" y="466" class="mu" style="fill:#f3dca0">Desligado nesta campanha: Naves e Veículos, PAD, Escala, Movimento e Evasão de naves. Religue em Módulos do Sistema.</text>
  <text x="258" y="482" class="mu">(a lista de rodapé só aparece quando há blocos desligados)</text>

  <g class="co"><circle cx="30" cy="64" r="11"/><text x="30" y="68">1</text></g>
  <g class="co"><circle cx="30" cy="104" r="11"/><text x="30" y="108">2</text></g>
  <g class="co"><circle cx="30" cy="144" r="11"/><text x="30" y="148">3</text></g>
  <g class="co"><circle cx="30" cy="184" r="11"/><text x="30" y="188">4</text></g>
  <g class="co"><circle cx="920" cy="122" r="11"/><text x="920" y="126">5</text></g>
  <g class="co"><circle cx="920" cy="468" r="11"/><text x="920" y="472">6</text></g>
</svg>
