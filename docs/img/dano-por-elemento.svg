<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa1c2"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .ti { fill: #e6e8f2; font-size: 18px; font-weight: 700; }
    .tx { fill: #e6e8f2; font-size: 13px; }
    .bd { fill: #e6e8f2; font-size: 13px; font-weight: 700; }
    .big { fill: #fff; font-size: 22px; font-weight: 700; }
    .mu { fill: #9aa1c2; font-size: 11.5px; }
    .ar { stroke: #9aa1c2; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  </style>
  <rect width="960" height="380" rx="14" fill="#12141c"/>
  <text x="30" y="40" class="ti">Exemplo: um golpe de dois elementos</text>
  <text x="30" y="60" class="mu">“Tempestade Bicolor” causa 100 de dano de Fogo + Gelo. O alvo é imune a Fogo, tem 20% de Resistência Geral e 30% de Resistência a Gelo.</text>

  <rect x="30" y="140" width="150" height="90" rx="10" fill="#232738" stroke="#9aa1c2" stroke-width="2"/>
  <text x="46" y="170" class="mu">dano do golpe</text>
  <text x="46" y="206" class="big">100</text>
  <path d="M180 170 C215 170 215 115 250 115" class="ar"/>
  <path d="M180 200 C215 200 215 265 250 265" class="ar"/>

  <!-- Fogo -->
  <rect x="254" y="82" width="120" height="66" rx="8" fill="#3a2317" stroke="#ff7043"/>
  <text x="266" y="104" class="bd" style="fill:#ffb199">Fogo</text><text x="266" y="134" class="big">50</text>
  <path d="M374 115 H408" class="ar"/>
  <rect x="412" y="82" width="340" height="66" rx="8" fill="#171a26" stroke="#ff7043" stroke-dasharray="5 3"/>
  <text x="426" y="106" class="bd">Imunidade a Fogo (100%)</text>
  <text x="426" y="126" class="mu">zera esta parte — nem Penetração atravessa,</text>
  <text x="426" y="140" class="mu">e os efeitos do Fogo (Queimadura) não pegam</text>
  <path d="M752 115 H786" class="ar"/>
  <rect x="790" y="82" width="140" height="66" rx="8" fill="#232738" stroke="#4a5380"/>
  <text x="804" y="104" class="mu">sobra</text><text x="804" y="134" class="big">0</text>

  <!-- Gelo -->
  <rect x="254" y="232" width="120" height="66" rx="8" fill="#16303a" stroke="#6ee7ff"/>
  <text x="266" y="254" class="bd" style="fill:#bff4ff">Gelo</text><text x="266" y="284" class="big">50</text>
  <path d="M374 265 H408" class="ar"/>
  <rect x="412" y="232" width="160" height="66" rx="8" fill="#2a2346" stroke="#a78bfa"/>
  <text x="424" y="254" class="bd">Geral −20%</text><text x="424" y="284" class="big">40</text>
  <path d="M572 265 H588" class="ar"/>
  <rect x="592" y="232" width="160" height="66" rx="8" fill="#2a2346" stroke="#a78bfa"/>
  <text x="604" y="254" class="bd">Gelo −30%</text><text x="604" y="284" class="big">28</text>
  <path d="M752 265 H786" class="ar"/>
  <rect x="790" y="232" width="140" height="66" rx="8" fill="#232738" stroke="#4a5380"/>
  <text x="804" y="254" class="mu">sobra</text><text x="804" y="284" class="big">28</text>

  <rect x="590" y="316" width="340" height="46" rx="8" fill="#2a2618" stroke="#e8c170" stroke-width="2"/>
  <text x="606" y="345" class="bd">Dano final no chat: 0 + 28 =</text>
  <text x="820" y="346" class="big" style="fill:#e8c170">28</text>
  <text x="30" y="345" class="mu">A imunidade a Fogo não protege contra a metade de Gelo.</text>
</svg>
