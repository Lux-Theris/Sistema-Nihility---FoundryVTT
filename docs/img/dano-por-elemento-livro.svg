<svg xmlns="http://www.w3.org/2000/svg" width="660" height="550" viewBox="0 0 660 550"><rect width="660" height="550" fill="#ffffff"/><text x="28" y="43" fill="#24292d" font-family="Georgia" font-size="29" font-weight="normal">Um golpe, dois elementos</text><path d="M28 64 H632" stroke="#985b46" stroke-width="2"/><text x="28" y="102" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">01</text><text x="82" y="102" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Dano inicial: 100</text><text x="82" y="133" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Fogo + Gelo: divida em duas partes de 50.</text><text x="28" y="177" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">02</text><text x="82" y="177" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">A metade de Fogo</text><text x="82" y="208" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">O alvo é imune a Fogo. Esta parte e os efeitos</text><text x="82" y="239" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">desse elemento não passam: sobra 0.</text><text x="28" y="283" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">03</text><text x="82" y="283" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">A metade de Gelo</text><text x="82" y="314" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">50 menos 20% de Resistência Geral = 40. Depois,</text><text x="82" y="345" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">menos 30% de Resistência a Gelo = 28.</text><text x="28" y="389" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">04</text><text x="82" y="389" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Resultado</text><text x="82" y="420" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">0 + 28 = 28 de dano após essas Resistências.</text><path d="M28 450 H632" stroke="#c7b9aa"/><text x="28" y="481" fill="#40566a" font-family="Segoe UI" font-size="20" font-weight="normal">Este exemplo isola elementos e Resistências. Outras</text><text x="28" y="509" fill="#40566a" font-family="Segoe UI" font-size="20" font-weight="normal">defesas dependem das características do golpe e do alvo.</text></svg>