<svg xmlns="http://www.w3.org/2000/svg" width="660" height="519" viewBox="0 0 660 519"><rect width="660" height="519" fill="#ffffff"/><text x="28" y="43" fill="#24292d" font-family="Georgia" font-size="29" font-weight="normal">Do Atributo à rolagem</text><path d="M28 64 H632" stroke="#985b46" stroke-width="2"/><text x="28" y="102" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">01</text><text x="82" y="102" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Total permanente</text><text x="82" y="133" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">12 pontos + 3 de Título = 15.</text><text x="28" y="177" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">02</text><text x="82" y="177" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Total Efetivo</text><text x="82" y="208" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">15 + 6 de bônus temporário = 21.</text><text x="28" y="252" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">03</text><text x="82" y="252" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Bônus</text><text x="82" y="283" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">21 dividido por 3, arredondando para baixo: 7.</text><text x="28" y="327" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">04</text><text x="82" y="327" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Dados e bônus de item</text><text x="82" y="358" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Com Bônus 7: 1d20 + 7. Um item de +2 acrescenta</text><text x="82" y="389" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">+2 por fora: 1d20 + 7 + 2.</text><path d="M28 419 H632" stroke="#c7b9aa"/><text x="28" y="450" fill="#40566a" font-family="Segoe UI" font-size="20" font-weight="normal">Exemplo didático. Vida e Mana usam o Total permanente,</text><text x="28" y="478" fill="#40566a" font-family="Segoe UI" font-size="20" font-weight="normal">não o Total Efetivo da rolagem.</text></svg>