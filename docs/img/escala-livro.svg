<svg xmlns="http://www.w3.org/2000/svg" width="660" height="519" viewBox="0 0 660 519"><rect width="660" height="519" fill="#ffffff"/><text x="28" y="43" fill="#24292d" font-family="Georgia" font-size="29" font-weight="normal">Tamanhos diferentes</text><path d="M28 64 H632" stroke="#985b46" stroke-width="2"/><text x="28" y="102" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">01</text><text x="82" y="102" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Pessoal → Veículo</text><text x="82" y="133" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Um degrau de diferença.</text><text x="28" y="177" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">02</text><text x="82" y="177" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Veículo → Nave</text><text x="82" y="208" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Mais um degrau.</text><text x="28" y="252" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">03</text><text x="82" y="252" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Nave → Capital</text><text x="82" y="283" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Mais um degrau.</text><text x="28" y="327" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">04</text><text x="82" y="327" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Fator padrão: 10 por degrau</text><text x="82" y="358" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Do maior para o menor, multiplique. Do menor</text><text x="82" y="389" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">para o maior, divida.</text><path d="M28 419 H632" stroke="#c7b9aa"/><text x="28" y="450" fill="#40566a" font-family="Segoe UI" font-size="20" font-weight="normal">Use apenas se a mesa ativar Escala. Uma diferença de dois</text><text x="28" y="478" fill="#40566a" font-family="Segoe UI" font-size="20" font-weight="normal">degraus usa o fator 100 no padrão da mesa.</text></svg>