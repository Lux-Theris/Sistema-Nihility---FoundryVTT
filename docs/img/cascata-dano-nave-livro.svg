<svg xmlns="http://www.w3.org/2000/svg" width="660" height="612" viewBox="0 0 660 612"><rect width="660" height="612" fill="#ffffff"/><text x="28" y="43" fill="#24292d" font-family="Georgia" font-size="29" font-weight="normal">As defesas de uma Nave</text><path d="M28 64 H632" stroke="#985b46" stroke-width="2"/><text x="28" y="102" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">01</text><text x="82" y="102" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Evasão</text><text x="82" y="133" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Evita uma fração do golpe, quando o módulo de</text><text x="82" y="164" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">movimento e Evasão está ligado.</text><text x="28" y="208" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">02</text><text x="82" y="208" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Escudo</text><text x="82" y="239" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Absorve dano em um pool próprio. Penetração e</text><text x="82" y="270" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">elementos podem mudar o que atravessa.</text><text x="28" y="314" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">03</text><text x="82" y="314" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Casco</text><text x="82" y="345" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">A Blindagem protege enquanto tem Vida; a Redução</text><text x="82" y="376" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">diminui o dano que chega a ela.</text><text x="28" y="420" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">04</text><text x="82" y="420" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Integridade Estrutural</text><text x="82" y="451" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">O dano restante atinge os Módulos. O card</text><text x="82" y="482" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">registra as camadas e os sistemas atingidos.</text><path d="M28 512 H632" stroke="#c7b9aa"/><text x="28" y="543" fill="#40566a" font-family="Segoe UI" font-size="20" font-weight="normal">Dano Absoluto ignora Escudo e Casco. A Evasão ainda se</text><text x="28" y="571" fill="#40566a" font-family="Segoe UI" font-size="20" font-weight="normal">aplica. Consulte as exceções de cada arma.</text></svg>