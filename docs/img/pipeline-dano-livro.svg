<svg xmlns="http://www.w3.org/2000/svg" width="660" height="643" viewBox="0 0 660 643"><rect width="660" height="643" fill="#ffffff"/><text x="28" y="43" fill="#24292d" font-family="Georgia" font-size="29" font-weight="normal">O percurso de um golpe</text><path d="M28 64 H632" stroke="#985b46" stroke-width="2"/><text x="28" y="102" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">01</text><text x="82" y="102" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Produzir o dano</text><text x="82" y="133" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Role a fórmula e aplique os multiplicadores,</text><text x="82" y="164" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">modificadores e escalas pertinentes.</text><text x="28" y="208" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">02</text><text x="82" y="208" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Encontrar obstáculos</text><text x="82" y="239" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Estruturas no caminho podem interceptar o golpe.</text><text x="28" y="283" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">03</text><text x="82" y="283" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Resolver cada alvo</text><text x="82" y="314" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Considere Penetração, elementos e defesas. Um</text><text x="82" y="345" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">alvo pode sofrer um resultado diferente de</text><text x="82" y="376" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">outro.</text><text x="28" y="420" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">04</text><text x="82" y="420" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Chegar aos recursos</text><text x="82" y="451" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">No personagem, o Escudo absorve primeiro; o</text><text x="82" y="482" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">restante chega à Vida. Confira Condições e</text><text x="82" y="513" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">consequências.</text><path d="M28 543 H632" stroke="#c7b9aa"/><text x="28" y="574" fill="#40566a" font-family="Segoe UI" font-size="20" font-weight="normal">Este é o percurso geral. Dano Absoluto, naves e outros</text><text x="28" y="602" fill="#40566a" font-family="Segoe UI" font-size="20" font-weight="normal">efeitos têm exceções próprias, descritas no texto.</text></svg>