<svg xmlns="http://www.w3.org/2000/svg" width="660" height="612" viewBox="0 0 660 612"><rect width="660" height="612" fill="#ffffff"/><text x="28" y="43" fill="#24292d" font-family="Georgia" font-size="29" font-weight="normal">Resistência e Imunidade</text><path d="M28 64 H632" stroke="#985b46" stroke-width="2"/><text x="28" y="102" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">01</text><text x="82" y="102" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">10% por nível</text><text x="82" y="133" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Uma Skill de Resistência bloqueia uma fração do</text><text x="82" y="164" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">dano ao qual se aplica.</text><text x="28" y="208" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">02</text><text x="82" y="208" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Resistência Geral</text><text x="82" y="239" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Chega ao nível 5: 50%. Não existe Imunidade</text><text x="82" y="270" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Geral.</text><text x="28" y="314" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">03</text><text x="82" y="314" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Resistência elemental</text><text x="82" y="345" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Chega ao nível 10: 100%, tornando-se Imunidade</text><text x="82" y="376" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">àquele elemento.</text><text x="28" y="420" fill="#985b46" font-family="Segoe UI" font-size="24" font-weight="bold">04</text><text x="82" y="420" fill="#40566a" font-family="Segoe UI" font-size="24" font-weight="bold">Fontes do mesmo tipo</text><text x="82" y="451" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">Duas Skills do mesmo alvo não somam: vale a</text><text x="82" y="482" fill="#24292d" font-family="Segoe UI" font-size="22" font-weight="normal">melhor. Skill e Título podem somar.</text><path d="M28 512 H632" stroke="#c7b9aa"/><text x="28" y="543" fill="#40566a" font-family="Segoe UI" font-size="20" font-weight="normal">As reduções de Resistência Geral e elemental são</text><text x="28" y="571" fill="#40566a" font-family="Segoe UI" font-size="20" font-weight="normal">sucessivas, não uma soma simples dos percentuais.</text></svg>